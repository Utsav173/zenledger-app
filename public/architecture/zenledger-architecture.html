<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenLedger · Local-First Core Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #090a0f;
      --color-surface: #11131a;
      --color-ink:     #f4f5f8;
      --color-muted:   #8a90a2;
      --color-soft:    #5e6578;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #00b2ff;
      --font-sans:     'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    /* Custom Ultra-Thin Dark Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #090a0f;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00b2ff;
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) #090a0f;
    }

    html, body {
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.25rem 1rem;
    }

    .frame {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--color-rule);
      padding-bottom: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.25rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 2vw + 0.8rem, 1.9rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted);
      margin-top: 0.25rem;
    }

    .badge-bar {
      display: flex;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--color-soft);
    }

    .badge {
      padding: 0.2rem 0.5rem;
      border: 1px solid var(--color-rule);
      border-radius: 4px;
      background: var(--color-surface);
    }

    .svg-container {
      width: 100%;
      overflow-x: auto;
      background: var(--color-surface);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1rem;
    }

    svg {
      width: 100%;
      min-width: 960px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <div>
        <p class="eyebrow">SYSTEM ARCHITECTURE // REVISED V3.2</p>
        <h1>Deterministic Local-First Operating System</h1>
        <p class="subtitle">Autonomous On-Device Daemons, Ingestion Staging, SQLite Core & Distributed Telemetry</p>
      </div>
      <div class="badge-bar">
        <span class="badge">ZERO_CLOUD_STORAGE</span>
        <span class="badge">LOCAL_CRON_DAEMON</span>
        <span class="badge">AES-256-GCM</span>
        <span class="badge">WAL_MODE</span>
      </div>
    </div>

    <div class="svg-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
        <title id="arch-title">ZenLedger Local-First System Architecture</title>
        <desc id="arch-desc">System diagram showing Presentation, Autonomous Daemons, Ingestion Engine, SQLite Core, and External Feeds.</desc>

        <defs>
          <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.75" fill="rgba(255,255,255,0.06)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#8a90a2"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#00b2ff"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#739fdf"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#0d0e14"/>
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- ZONE 1: Client Application Runtime (Left) -->
        <rect x="36" y="44" width="200" height="428" rx="8"
              fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <rect x="52" y="38" width="128" height="14" rx="2" fill="#0d0e14"/>
        <text x="56" y="48" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">01 · PRESENTATION</text>

        <!-- ZONE 2: Autonomous Local Daemons & Ingestion (Center-Left) -->
        <rect x="256" y="44" width="216" height="428" rx="8"
              fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <rect x="272" y="38" width="160" height="14" rx="2" fill="#0d0e14"/>
        <text x="276" y="48" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">02 · AUTONOMOUS DAEMONS</text>

        <!-- ZONE 3: Secure Enclave & Storage Core (Center-Right) -->
        <rect x="492" y="44" width="224" height="428" rx="8"
              fill="rgba(255,255,255,0.02)" stroke="rgba(0,178,255,0.3)" stroke-width="1"/>
        <rect x="508" y="38" width="168" height="14" rx="2" fill="#0d0e14"/>
        <text x="512" y="48" fill="#00b2ff" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">03 · SECURITY & LEDGER</text>

        <!-- ZONE 4: Passive Feeds & Workers (Right) -->
        <rect x="736" y="44" width="188" height="428" rx="8"
              fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="752" y="38" width="156" height="14" rx="2" fill="#0d0e14"/>
        <text x="756" y="48" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">04 · PERIPHERAL FEEDS</text>

        <!-- CONNECTORS -->
        <!-- UI to Query Cache -->
        <line x1="216" y1="116" x2="276" y2="116" stroke="#8a90a2" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Ingestion to Rule Evaluator -->
        <line x1="216" y1="296" x2="276" y2="296" stroke="#8a90a2" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Query Cache to SQLite Core -->
        <path d="M 452,116 H 512" fill="none" stroke="#8a90a2" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Local Cron Daemon to Hardware Alarms -->
        <line x1="384" y1="236" x2="384" y2="260" stroke="#8a90a2" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Rule Evaluator to SQLite Core (Focal path) -->
        <path d="M 452,296 H 512" fill="none" stroke="#00b2ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- KeyStore Biometric Gate to SQLite -->
        <line x1="604" y1="152" x2="604" y2="260" stroke="#00b2ff" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- SQLite to Encrypted Backup Envelope -->
        <line x1="604" y1="340" x2="604" y2="380" stroke="#8a90a2" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

        <!-- Feeds to Cache -->
        <path d="M 756,116 H 696" fill="none" stroke="#739fdf" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <path d="M 756,224 H 696" fill="none" stroke="#739fdf" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>

        <!-- NODES IN ZONE 1: Presentation -->
        <g id="node-app-shell">
          <rect x="56" y="84" width="160" height="64" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="68" y="108" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Expo App Shell</text>
          <text x="68" y="124" fill="#8a90a2" font-size="9" font-family="'Geist Mono', monospace">Tabs · Detail Modals</text>
          <text x="68" y="137" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Offline-first navigation</text>
        </g>

        <g id="node-portfolio-analytics">
          <rect x="56" y="174" width="160" height="64" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="68" y="198" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Portfolio Engine</text>
          <text x="68" y="214" fill="#8a90a2" font-size="9" font-family="'Geist Mono', monospace">FIFO Lots · Newton XIRR</text>
          <text x="68" y="227" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">100x fixed-point scaling</text>
        </g>

        <g id="node-hotfolder-ui">
          <rect x="56" y="264" width="160" height="64" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="68" y="288" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Batch Ingestion UI</text>
          <text x="68" y="304" fill="#8a90a2" font-size="9" font-family="'Geist Mono', monospace">Hot Folder Drop Watcher</text>
          <text x="68" y="317" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Multi-PDF Micro-Diff Staging</text>
        </g>

        <g id="node-recovery-ui">
          <rect x="56" y="354" width="160" height="64" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="68" y="378" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Recovery Kit</text>
          <text x="68" y="394" fill="#8a90a2" font-size="9" font-family="'Geist Mono', monospace">Zero-Knowledge Vault</text>
          <text x="68" y="407" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Cross-Device Restore</text>
        </g>

        <!-- NODES IN ZONE 2: Autonomous Daemons -->
        <g id="node-query-cache">
          <rect x="276" y="84" width="176" height="64" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="288" y="108" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">TanStack Cache</text>
          <text x="288" y="124" fill="#8a90a2" font-size="9" font-family="'Geist Mono', monospace">In-Memory O(1) Cache</text>
          <text x="288" y="137" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Stale-While-Revalidate</text>
        </g>

        <g id="node-cron-daemon">
          <rect x="276" y="174" width="176" height="64" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="288" y="198" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">LocalCronDaemon</text>
          <text x="288" y="214" fill="#8a90a2" font-size="9" font-family="'Geist Mono', monospace">Hardware OS Alarms</text>
          <text x="288" y="227" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Bill Dues · SIPs · FD Maturity</text>
        </g>

        <g id="node-rule-evaluator">
          <rect x="276" y="264" width="176" height="64" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="288" y="288" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Rule Evaluator</text>
          <text x="288" y="304" fill="#8a90a2" font-size="9" font-family="'Geist Mono', monospace">Boolean AST & Regex</text>
          <text x="288" y="317" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Auto-tagging & Narration Strip</text>
        </g>

        <g id="node-recurring-scheduler">
          <rect x="276" y="354" width="176" height="64" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="288" y="378" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Recurring Scheduler</text>
          <text x="288" y="394" fill="#8a90a2" font-size="9" font-family="'Geist Mono', monospace">Virtual Queue Projection</text>
          <text x="288" y="407" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Forward cashflow pacing</text>
        </g>

        <!-- NODES IN ZONE 3: Security & Storage Core -->
        <g id="node-biometric-gate">
          <rect x="512" y="84" width="184" height="68" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="524" y="108" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">SecureStore Enclave</text>
          <text x="524" y="124" fill="#8a90a2" font-size="9" font-family="'Geist Mono', monospace">Hardware KeyStore & Biometrics</text>
          <text x="524" y="137" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Statement Password Keychain</text>
        </g>

        <!-- FOCAL NODE: SQLite Core -->
        <g id="node-sqlite-core">
          <rect x="512" y="240" width="184" height="100" rx="6" fill="rgba(0,178,255,0.06)" stroke="#00b2ff" stroke-width="1.5"/>
          <text x="524" y="268" fill="#ffffff" font-size="12" font-weight="600" font-family="'Geist', sans-serif">SQLite WAL Core</text>
          <text x="524" y="284" fill="#00b2ff" font-size="9" font-family="'Geist Mono', monospace">13 Normalized Tables</text>
          <text x="524" y="298" fill="#8a90a2" font-size="8" font-family="'Geist Mono', monospace">Balance Continuity [MATH_LOCK]</text>
          <text x="524" y="310" fill="#8a90a2" font-size="8" font-family="'Geist Mono', monospace">Self-Healing Migration Guard</text>
          <text x="524" y="323" fill="#5e6578" font-size="7.5" font-family="'Geist Mono', monospace">100% On-Device Persistence</text>
        </g>

        <g id="node-encrypted-backup">
          <rect x="512" y="380" width="184" height="52" rx="6" fill="#151722" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          <text x="524" y="402" fill="#f4f5f8" font-size="10" font-weight="600" font-family="'Geist', sans-serif">AES-256-GCM Envelope</text>
          <text x="524" y="416" fill="#8a90a2" font-size="8" font-family="'Geist Mono', monospace">PBKDF2 (600k iter) Backup File</text>
        </g>

        <!-- NODES IN ZONE 4: Peripheral Feeds & Proxies -->
        <g id="node-yahoo-worker">
          <rect x="756" y="92" width="148" height="52" rx="6" fill="#151722" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          <text x="768" y="114" fill="#f4f5f8" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Cloudflare Proxy</text>
          <text x="768" y="128" fill="#8a90a2" font-size="8" font-family="'Geist Mono', monospace">NSE/BSE Equity Worker</text>
          <text x="768" y="138" fill="#5e6578" font-size="7.5" font-family="'Geist Mono', monospace">Edge caching proxy</text>
        </g>

        <g id="node-direct-feeds">
          <rect x="756" y="196" width="148" height="52" rx="6" fill="#151722" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          <text x="768" y="218" fill="#f4f5f8" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Direct Market Feeds</text>
          <text x="768" y="232" fill="#8a90a2" font-size="8" font-family="'Geist Mono', monospace">AMFI NAV & PAXG Gold</text>
          <text x="768" y="242" fill="#5e6578" font-size="7.5" font-family="'Geist Mono', monospace">Direct keyless feeds</text>
        </g>

        <g id="node-email-service">
          <rect x="756" y="300" width="148" height="52" rx="6" fill="#151722" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          <text x="768" y="322" fill="#f4f5f8" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Email Service</text>
          <text x="768" y="336" fill="#8a90a2" font-size="8" font-family="'Geist Mono', monospace">Containerized Microservice</text>
          <text x="768" y="346" fill="#5e6578" font-size="7.5" font-family="'Geist Mono', monospace">Local summaries dispatch</text>
        </g>

        <!-- FOOTER ANNOTATIONS -->
        <text x="36" y="496" fill="#5e6578" font-size="8.5" font-family="'Geist Mono', monospace">ZenLedger Architecture v3.2 · diagram-design spec · 4px grid · 1px hairlines · 0 JS runtimes</text>
      </svg>
    </div>
  </div>
</body>
</html>
