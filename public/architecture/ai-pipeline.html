<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenLedger · Cognitive Statement & Ingestion Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #090a0f;
      --color-surface: #11131a;
      --color-ink:     #f4f5f8;
      --color-muted:   #8a90a2;
      --color-soft:    #5e6578;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #10b981; /* Emerald/Mint verification focal */
      --color-blue:    #00b2ff;
      --font-sans:     'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    /* Custom Ultra-Thin Dark Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #090a0f;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) #090a0f;
    }

    html, body {
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.25rem 1rem;
    }

    .frame {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--color-rule);
      padding-bottom: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.25rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 2vw + 0.8rem, 1.9rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted);
      margin-top: 0.25rem;
    }

    .badge-bar {
      display: flex;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--color-soft);
    }

    .badge {
      padding: 0.2rem 0.5rem;
      border: 1px solid var(--color-rule);
      border-radius: 4px;
      background: var(--color-surface);
    }

    .svg-container {
      width: 100%;
      overflow-x: auto;
      background: var(--color-surface);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1rem;
    }

    svg {
      width: 100%;
      min-width: 960px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <div>
        <p class="eyebrow">COGNITIVE ENGINE // 5-STAGE INGESTION</p>
        <h1>Statement Extraction & Balance Continuity Pipeline</h1>
        <p class="subtitle">Hot-Folder watcher, SecureStore keychain, Spatial geometry, LiteRT Gemma, and Viterbi balance proof</p>
      </div>
      <div class="badge-bar">
        <span class="badge">HOT_FOLDER_BATCH</span>
        <span class="badge">KEYCHAIN_AUTO_UNLOCK</span>
        <span class="badge">VITERBI_MATH_LOCK</span>
      </div>
    </div>

    <div class="svg-container">
      <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-pipeline-title ai-pipeline-desc">
        <title id="ai-pipeline-title">ZenLedger AI Ingestion Pipeline</title>
        <desc id="ai-pipeline-desc">Five-stage data flow diagram showing Hot-Folder Batch Ingestion, Spatial Geometry, LiteRT Neural Inference, Viterbi Trellis Verification, and SQLite Persistence.</desc>

        <defs>
          <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.75" fill="rgba(255,255,255,0.06)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#8a90a2"/>
          </marker>
          <marker id="arrow-focal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#0d0e14"/>
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- STAGE COLUMNS / GUIDES -->
        <!-- Stage 1: Ingestion -->
        <line x1="192" y1="40" x2="192" y2="420" stroke="rgba(255,255,255,0.04)" stroke-dasharray="2,4"/>
        <!-- Stage 2: Spatial Geometry -->
        <line x1="384" y1="40" x2="384" y2="420" stroke="rgba(255,255,255,0.04)" stroke-dasharray="2,4"/>
        <!-- Stage 3: Neural Inference -->
        <line x1="576" y1="40" x2="576" y2="420" stroke="rgba(255,255,255,0.04)" stroke-dasharray="2,4"/>
        <!-- Stage 4: Mathematical Verification -->
        <line x1="768" y1="40" x2="768" y2="420" stroke="rgba(255,255,255,0.04)" stroke-dasharray="2,4"/>

        <!-- STAGE HEADERS -->
        <text x="40" y="64" fill="#5e6578" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">STAGE 01 · HOT-FOLDER</text>
        <text x="216" y="64" fill="#5e6578" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">STAGE 02 · GEOMETRY</text>
        <text x="408" y="64" fill="#5e6578" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">STAGE 03 · INFERENCE</text>
        <text x="600" y="64" fill="#10b981" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">STAGE 04 · PROOF</text>
        <text x="792" y="64" fill="#5e6578" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em">STAGE 05 · COMMIT</text>

        <!-- CONNECTORS -->
        <!-- Ingest 1 -> SpatialLattice -->
        <line x1="176" y1="140" x2="216" y2="140" stroke="#8a90a2" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Ingest 2 -> SpatialLattice -->
        <path d="M 176,270 H 196 Q 204,270 204,260 V 160 Q 204,150 212,150 H 216" fill="none" stroke="#8a90a2" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- SpatialLattice -> Gemma LLM -->
        <line x1="368" y1="140" x2="408" y2="140" stroke="#8a90a2" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Shannon Token Filter -> Gemma LLM -->
        <path d="M 368,270 H 388 Q 396,270 396,260 V 160 Q 396,150 404,150 H 408" fill="none" stroke="#8a90a2" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Gemma LLM -> Viterbi Trellis Solver (Focal transition) -->
        <line x1="560" y1="140" x2="600" y2="140" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-focal)"/>

        <!-- Viterbi -> SQLite Core -->
        <line x1="752" y1="140" x2="792" y2="140" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-focal)"/>

        <!-- Fallback loop from Viterbi to Merchant Memory Graph -->
        <path d="M 676,192 V 240 Q 676,248 668,248 H 568" fill="none" stroke="#8a90a2" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Merchant Memory Graph to SQLite -->
        <path d="M 408,270 H 392 Q 384,270 384,280 V 330 Q 384,340 392,340 H 784 Q 792,340 792,330 V 192" fill="none" stroke="#8a90a2" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- STAGE 01 NODES -->
        <!-- Node: Hot Folder & Batch Ingest -->
        <g id="node-hotfolder">
          <rect x="40" y="104" width="136" height="72" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="52" y="128" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Hot-Folder Watch</text>
          <text x="52" y="144" fill="#8a90a2" font-size="8.5" font-family="'Geist Mono', monospace">Batch Drop Queue</text>
          <text x="52" y="158" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Multi-PDF Auto Ingest</text>
        </g>

        <!-- Node: Password Keychain Unlock -->
        <g id="node-keychain">
          <rect x="40" y="234" width="136" height="72" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="52" y="258" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Secure Keychain</text>
          <text x="52" y="274" fill="#8a90a2" font-size="8.5" font-family="'Geist Mono', monospace">PAN & DOB Formula</text>
          <text x="52" y="288" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Auto-Decrypt Bank PDF</text>
        </g>

        <!-- STAGE 02 NODES -->
        <!-- Node: SpatialLattice -->
        <g id="node-spatial-lattice">
          <rect x="216" y="104" width="152" height="72" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="228" y="128" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">SpatialLattice 2D</text>
          <text x="228" y="144" fill="#8a90a2" font-size="8.5" font-family="'Geist Mono', monospace">1D Gaussian KDE</text>
          <text x="228" y="158" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Column boundary scan</text>
        </g>

        <!-- Node: Shannon Entropy Token Filter -->
        <g id="node-entropy-filter">
          <rect x="216" y="234" width="152" height="72" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="228" y="258" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Entropy Peeler</text>
          <text x="228" y="274" fill="#8a90a2" font-size="8.5" font-family="'Geist Mono', monospace">Shannon H(X) Filter</text>
          <text x="228" y="288" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Transit noise stripping</text>
        </g>

        <!-- STAGE 03 NODES -->
        <!-- Node: LiteRT Gemma 2B -->
        <g id="node-litert-gemma">
          <rect x="408" y="104" width="152" height="72" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="420" y="128" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">LiteRT Gemma 2B</text>
          <text x="420" y="144" fill="#8a90a2" font-size="8.5" font-family="'Geist Mono', monospace">INT4 On-Device Model</text>
          <text x="420" y="158" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">JSON semantic extraction</text>
        </g>

        <!-- Node: Counterparty Graph -->
        <g id="node-merchant-memory">
          <rect x="408" y="234" width="152" height="72" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="420" y="258" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Merchant Graph</text>
          <text x="420" y="274" fill="#8a90a2" font-size="8.5" font-family="'Geist Mono', monospace">Trigram Fuzzy Scoring</text>
          <text x="420" y="288" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Counterparty normalizer</text>
        </g>

        <!-- STAGE 04 FOCAL NODE -->
        <!-- Node: Viterbi Trellis Solver -->
        <g id="node-viterbi-solver">
          <rect x="600" y="96" width="152" height="88" rx="6" fill="rgba(16,185,129,0.06)" stroke="#10b981" stroke-width="1.5"/>
          <text x="612" y="122" fill="#ffffff" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Viterbi Trellis Solver</text>
          <text x="612" y="138" fill="#10b981" font-size="8.5" font-family="'Geist Mono', monospace">Balance Continuity DP</text>
          <text x="612" y="152" fill="#8a90a2" font-size="8.5" font-family="'Geist Mono', monospace">Diophantine Subset-Sum</text>
          <text x="612" y="166" fill="#5e6578" font-size="7.5" font-family="'Geist Mono', monospace">[MATH_LOCK] Stamping</text>
        </g>

        <!-- STAGE 05 NODES -->
        <!-- Node: Local SQLite Ledger Commit -->
        <g id="node-sqlite-commit">
          <rect x="792" y="104" width="136" height="72" rx="6" fill="#151722" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <text x="804" y="128" fill="#f4f5f8" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Immutable Ledger</text>
          <text x="804" y="144" fill="#8a90a2" font-size="8.5" font-family="'Geist Mono', monospace">SQLite WAL Commit</text>
          <text x="804" y="158" fill="#5e6578" font-size="8" font-family="'Geist Mono', monospace">Atomic transaction lock</text>
        </g>

        <!-- BOTTOM LEGEND -->
        <rect x="40" y="380" width="888" height="40" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="56" y="404" fill="#8a90a2" font-size="9" font-family="'Geist Mono', monospace">MATHEMATICAL INVARIANT:</text>
        <text x="210" y="404" fill="#f4f5f8" font-size="9" font-family="'Geist Mono', monospace">Balance[t] = Balance[t-1] ± Amount[t]. Verified rows receive immutable [MATH_LOCK] and cannot be mutated.</text>
      </svg>
    </div>
  </div>
</body>
</html>
